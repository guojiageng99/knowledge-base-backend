server:
  port: 8080

spring:
  application:
    name: kb-gateway
  cloud:
    gateway:
      routes:
        - id: kb-user-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: kb-document
          uri: http://localhost:8082
          predicates:
            - Path=/api/document/**
        - id: kb-search
          uri: http://localhost:8083
          predicates:
            - Path=/api/search/**
        - id: kb-file
          uri: http://localhost:8084
          predicates:
            - Path=/api/file/**
        - id: kb-foundation
          uri: http://localhost:8089
          predicates:
            - Path=/api/foundation/**
        - id: kb-foundation-notifications
          uri: http://localhost:8089
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/notifications(?<segment>/?.*), /api/foundation/notifications$\{segment}
        - id: kb-foundation-ws
          uri: ws://localhost:8089
          predicates:
            - Path=/ws/**
          filters:
            - RewritePath=/ws(?<segment>/?.*), /api/foundation/ws$\{segment}
        - id: kb-ai
          uri: http://localhost:8086
          predicates:
            - Path=/api/ai/**
        - id: kb-graph
          uri: http://localhost:8088
          predicates:
            - Path=/api/graph/**
        - id: kb-statistics
          uri: http://localhost:8090
          predicates:
            - Path=/api/statistics/**

logging:
  level:
    com.knowledge.base.gateway: INFO
