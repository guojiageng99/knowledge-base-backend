server:
  port: 8086
  servlet:
    context-path: /api/ai
spring:
  application:
    name: kb-ai
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/kb_ai?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      mode: never
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 10s
    socket-timeout: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.knowledge.base.ai.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
qwen:
  api-key: ${QWEN_API_KEY:your-qwen-api-key}
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  chat:
    options:
      model: ${QWEN_MODEL:qwen3-max}
      temperature: ${QWEN_TEMPERATURE:0.3}
      max-tokens: ${QWEN_MAX_TOKENS:4000}
deepseek:
  api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
  temperature: ${DEEPSEEK_TEMPERATURE:0.7}
ai:
  default-model: ${AI_DEFAULT_MODEL:qwen}
rag:
  enabled: ${RAG_ENABLED:true}
  chunking:
    chunk-size: ${RAG_CHUNK_SIZE:512}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:64}
  embedding:
    model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
    dimension: ${RAG_EMBEDDING_DIMENSION:1024}
    cache-ttl-seconds: ${RAG_EMBEDDING_CACHE_TTL:86400}
  retrieval:
    default-top-k: ${RAG_RETRIEVAL_TOP_K:5}
    hybrid-top-k: ${RAG_HYBRID_TOP_K:20}
    rrf-c: ${RAG_RRF_C:60}
  rerank:
    enabled: ${RAG_RERANK_ENABLED:false}
    model: ${RAG_RERANK_MODEL:qwen}
  index:
    name: ${RAG_INDEX_NAME:kb_chunk}
    shards: ${RAG_INDEX_SHARDS:1}
    replicas: ${RAG_INDEX_REPLICAS:0}
  reindex:
    batch-size: ${RAG_REINDEX_BATCH_SIZE:10}
    max-retries: ${RAG_REINDEX_MAX_RETRIES:3}
  rabbit:
    enabled: ${RAG_RABBIT_ENABLED:false}
document:
  service:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:8082/api/document}
