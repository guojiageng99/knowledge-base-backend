name: knowledge-base

services:
  mysql:
    image: mysql:8.4
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=80"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-kb}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mongodb:
    image: mongo:7
    container_name: kb-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 10s
      retries: 20

  rustfs:
    image: minio/minio:latest
    container_name: kb-rustfs
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: minio/mc:latest
    container_name: kb-rustfs-init
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: knowledge-base
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY";
        do sleep 2; done;
        mc mb --ignore-existing "local/$$RUSTFS_BUCKET"
    depends_on:
      rustfs: {condition: service_started}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: kb-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: kb-neo4j
    restart: unless-stopped
    profiles: [full]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  gateway:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-gateway.jar
    container_name: kb-gateway
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC"
      USER_AUTH_URL: http://user-auth:8081
      DOCUMENT_SERVICE_URL: http://document:8082
      SEARCH_SERVICE_URL: http://search:8083
      FILE_SERVICE_URL: http://file:8084
      FOUNDATION_SERVICE_URL: http://foundation:8089
      FOUNDATION_WS_URL: ws://foundation:8089
      AI_SERVICE_URL: http://ai:8086
      GRAPH_SERVICE_URL: http://graph:8088
      STATISTICS_SERVICE_URL: http://statistics:8090
    depends_on:
      user-auth: {condition: service_started}
      document: {condition: service_started}
      file: {condition: service_started}
      foundation: {condition: service_started}

  user-auth:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-user-auth.jar
    container_name: kb-user-auth
    restart: unless-stopped
    environment: &backend-env
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-kb}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      APP_INSTANCE_ID: ${APP_INSTANCE_ID:-knowledge-base}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  document:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-document.jar
    container_name: kb-document
    restart: unless-stopped
    environment:
      <<: *backend-env
      MONGODB_URI: mongodb://mongodb:27017/knowledge_base?serverSelectionTimeoutMS=5000
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      FILE_SERVICE_URL: http://file:8084/api/file
      AI_SERVICE_URL: http://ai:8086/api/ai
      SEARCH_SERVICE_URL: http://search:8083/api/search
      FILE_UPLOAD_PATH: /data/uploads
    volumes:
      - document-uploads:/data/uploads
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      rabbitmq: {condition: service_started}

  file:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-file.jar
    container_name: kb-file
    restart: unless-stopped
    environment:
      <<: *backend-env
      RABBITMQ_HOST: rabbitmq
      RUSTFS_ENDPOINT: rustfs
      RUSTFS_PORT: 9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: knowledge-base
      SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED: "false"
    volumes:
      - file-uploads:/app/uploads
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rustfs-init: {condition: service_completed_successfully}
      rabbitmq: {condition: service_started}

  foundation:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-foundation.jar
    container_name: kb-foundation
    restart: unless-stopped
    environment:
      <<: *backend-env
      REDIS_ENABLED: "false"
      RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_started}

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: kb-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      gateway: {condition: service_started}

  search:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-search.jar
    container_name: kb-search
    restart: unless-stopped
    environment:
      <<: *backend-env
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      DOCUMENT_SERVICE_URL: http://document:8082/api/document
      AI_SERVICE_URL: http://ai:8086/api/ai
    depends_on:
      mysql: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

  ai:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-ai.jar
    container_name: kb-ai
    restart: unless-stopped
    profiles: [full]
    environment:
      <<: *backend-env
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      DOCUMENT_SERVICE_URL: http://document:8082/api/document
      GRAPH_SERVICE_URL: http://graph:8088/api/graph
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.3}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-4000}
      RAG_ENABLED: ${RAG_ENABLED:-false}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

  graph:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-graph.jar
    container_name: kb-graph
    restart: unless-stopped
    profiles: [full]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    depends_on:
      neo4j: {condition: service_started}

  statistics:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        JAR_FILE: backend/kb-statistics.jar
    container_name: kb-statistics
    restart: unless-stopped
    profiles: [full]
    environment:
      <<: *backend-env
    depends_on:
      mysql: {condition: service_healthy}

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  rustfs-data:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
  rabbitmq-data:
  document-uploads:
  file-uploads:
