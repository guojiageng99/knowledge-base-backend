server:
  port: 8084
  servlet:
    context-path: /api/file

spring:
  application:
    name: kb-file

app:
  instance:
    id: ${APP_INSTANCE_ID:}
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:kb-file-dev.yaml}
  cloud:
    nacos:
      config:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:KNOWLEDGE_BASE}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:KNOWLEDGE_BASE}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kb_file?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,wall
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 1
        prefetch: 1
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.file.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

file:
  upload:
    path: ./uploads
  storage:
    type: rustfs
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:localhost}
      port: ${RUSTFS_PORT:9000}
      access-key: ${RUSTFS_ACCESS_KEY:knowledge-base}
      secret-key: ${RUSTFS_SECRET_KEY:knowledge-base-secret}
      secure: ${RUSTFS_SECURE:false}
      bucket-name: ${RUSTFS_BUCKET:knowledge-base}
      connect-timeout: 30000
      read-timeout: 60000
      write-timeout: 60000
      max-connections: 50
      enabled: true
    upload:
      max-size: 52428800
      allowed-types:
        - pdf
        - doc
        - docx
        - xls
        - xlsx
        - ppt
        - pptx
        - txt
        - md
        - png
        - jpg
        - jpeg
        - gif
        - bmp
        - svg
        - mp4
        - avi
        - mov
        - wmv
        - mkv
        - webm
        - flv
        - mp3
        - wav
        - flac
        - aac
        - ogg
      enable-fast-upload: true
      calculate-hash: true
      enable-resumable-upload: true
    ffmpeg:
      path: ${FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      hls-segment-time: ${HLS_SEGMENT_TIME:10}
      thumbnail-time: ${THUMBNAIL_TIME:5}
      timeout-seconds: ${FFMPEG_TIMEOUT_SECONDS:900}
    url:
      prefix: /api/file/files
      preview-prefix: /api/file/files/preview
  transcode:
    rabbit:
      enabled: ${TRANSCODE_RABBIT_ENABLED:false}

knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false
